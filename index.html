  <script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-body::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;

    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd">
          <b>{title}</b>
          <button className="twk-x" onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}
function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span><span className="twk-val">{value}{unit}</span></div>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </div>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </div>
  );
}
function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection,
  TweakSlider, TweakToggle, TweakSelect, TweakButton,
});
  </script>

  <script type="text/babel">
const { useEffect, useRef } = React;

function BouncingBall({ width = 600, height = 300, size = 48, gravity = 2000, restitution = 0.6, bounces = 6, startFrom = "top-left", progress = null, showTrail = true, obstacles = [], onObstacleHit }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const obsRef = useRef(obstacles);
  const hitCbRef = useRef(onObstacleHit);
  useEffect(() => { obsRef.current = obstacles; }, [obstacles]);
  useEffect(() => { hitCbRef.current = onObstacleHit; }, [onObstacleHit]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const r = size / 2;
    const spd = Math.max(width, height) * 0.55;

    let x, y, vx, vy;
    if (startFrom === "top-right")     { x = width - r - 8; y = r + 8; vx = -spd * 0.45; vy = spd * 0.1; }
    else if (startFrom === "top-left") { x = r + 8;         y = r + 8; vx =  spd * 0.45; vy = spd * 0.1; }
    else                               { x = width * 0.5;   y = r + 8; vx =  spd * 0.35; vy = 0; }

    const trail = [];
    let lastTime = null, bounceCount = 0;

    // ── ドラッグ状態 ──
    let dragging = false, grabbed = false;
    let dragVx = 0, dragVy = 0;
    let lastDragX = 0, lastDragY = 0, lastDragTime = 0;

    function canvasXY(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = width / rect.width, sy = height / rect.height;
      const src = e.touches ? e.touches[0] : e;
      return { px: (src.clientX - rect.left) * sx, py: (src.clientY - rect.top) * sy };
    }

    function onDown(e) {
      const { px, py } = canvasXY(e);
      if (Math.hypot(px - x, py - y) > r + 24) return;
      dragging = grabbed = true;
      dragVx = dragVy = vx = vy = 0;
      lastDragX = x = px; lastDragY = y = py;
      lastDragTime = performance.now();
      if (canvas.setPointerCapture && e.pointerId != null) canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = "grabbing";
      e.preventDefault();
    }
    function onMove(e) {
      const { px, py } = canvasXY(e);
      if (!dragging) {
        canvas.style.cursor = Math.hypot(px - x, py - y) <= r + 24 ? "grab" : "default";
        return;
      }
      const now = performance.now();
      const dt = Math.max(0.001, (now - lastDragTime) / 1000);
      dragVx = (px - lastDragX) / dt;
      dragVy = (py - lastDragY) / dt;
      lastDragX = x = px; lastDragY = y = py; lastDragTime = now;
      e.preventDefault();
    }
    function onUp() {
      if (!dragging) return;
      dragging = grabbed = false;
      // フリック速度を引き継ぐ（少し減衰）
      vx = dragVx * 0.75; vy = dragVy * 0.75;
      bounceCount = 0;
      canvas.style.cursor = "default";
    }

    canvas.addEventListener("pointerdown",  onDown,  { passive: false });
    canvas.addEventListener("pointermove",  onMove,  { passive: false });
    canvas.addEventListener("pointerup",    onUp);
    canvas.addEventListener("pointercancel",onUp);

    function step(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min((ts - lastTime) / 1000, 0.05);
      lastTime = ts;

      if (!dragging) {
        if (progress !== null) {
          x = r + (width - size) * progress;
          vy += gravity * dt; y += vy * dt;
          if (y + r >= height) { y = height - r; vy = -Math.abs(vy) * restitution; }
          if (y - r <= 0)      { y = r;           vy =  Math.abs(vy) * restitution; }
        } else {
          vy += gravity * dt; x += vx * dt; y += vy * dt;
          if (x - r <= 0)      { x = r;          vx =  Math.abs(vx) * restitution; }
          if (x + r >= width)  { x = width - r;  vx = -Math.abs(vx) * restitution; }
          if (y + r >= height) { y = height - r; vy = -Math.abs(vy) * restitution; bounceCount++; }
          if (y - r <= 0)      { y = r;           vy =  Math.abs(vy) * restitution; }
          if (bounceCount >= bounces && Math.abs(vy) < 40) { vy = -spd * 0.25 * restitution; bounceCount = 0; }
        }
        // 障害物（文字など矩形）との衝突
        const obsList = obsRef.current || [];
        for (const ob of obsList) {
          const cx = Math.max(ob.x, Math.min(x, ob.x + ob.w));
          const cy = Math.max(ob.y, Math.min(y, ob.y + ob.h));
          const dx = x - cx, dy = y - cy;
          const distSq = dx*dx + dy*dy;
          if (distSq < r*r && distSq > 0.001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist, ny = dy / dist;
            x = cx + nx * r;
            y = cy + ny * r;
            const vn = vx * nx + vy * ny;
            if (vn < 0) {
              vx -= (1 + restitution) * vn * nx;
              vy -= (1 + restitution) * vn * ny;
            }
            if (ob.id != null && hitCbRef.current) hitCbRef.current(ob.id);
          }
        }
      }

      if (showTrail && !grabbed) { trail.push({ x, y }); if (trail.length > 28) trail.shift(); }
      else if (grabbed) trail.length = 0;

      ctx.clearRect(0, 0, width, height);

      // トレイル
      if (showTrail && trail.length > 1) {
        for (let i = 1; i < trail.length; i++) {
          const frac = i / trail.length;
          ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, r * frac * 0.72, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,71,255,${frac * 0.14})`; ctx.fill();
        }
      }

      // 床の影（掴んでいないとき）
      if (!grabbed) {
        const distFrac = Math.max(0, 1 - y / height);
        const sx = r * 0.9 * (1 - distFrac * 0.4), sy = r * 0.18 * (1 - distFrac * 0.4);
        if (sx > 0 && sy > 0) {
          ctx.beginPath(); ctx.ellipse(x, height - 3, sx, sy, 0, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,71,255,${0.14 * (1 - distFrac)})`; ctx.fill();
        }
      }

      // 掴んでいるときのグロー
      if (grabbed) {
        ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,71,255,0.10)"; ctx.fill();
      }

      // ボール本体（掴むと少し大きく）
      const dr = grabbed ? r * 1.07 : r;
      const grad = ctx.createRadialGradient(x - dr * 0.28, y - dr * 0.28, dr * 0.04, x, y, dr);
      grad.addColorStop(0, "#5a8fff"); grad.addColorStop(1, "#0047ff");
      ctx.beginPath(); ctx.arc(x, y, dr, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath(); ctx.arc(x - dr * 0.26, y - dr * 0.26, dr * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fill();

      animRef.current = requestAnimationFrame(step);
    }

    animRef.current = requestAnimationFrame(step);
    return () => {
      cancelAnimationFrame(animRef.current);
      canvas.removeEventListener("pointerdown",  onDown);
      canvas.removeEventListener("pointermove",  onMove);
      canvas.removeEventListener("pointerup",    onUp);
      canvas.removeEventListener("pointercancel",onUp);
    };
  }, [width, height, size, gravity, restitution, bounces, startFrom, progress, showTrail]);

  return <canvas ref={canvasRef} width={width} height={height} style={{ display:"block", maxWidth:"100%", touchAction:"none" }} />;
}

function Button({ children, onClick, size = "md", variant = "solid", icon, full = false, disabled = false }) {
  const pad = size === "lg" ? "11px 24px" : size === "sm" ? "5px 12px" : "8px 18px";
  const fs  = size === "lg" ? 15 : size === "sm" ? 12 : 14;
  const base = { display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8, padding:pad, fontSize:fs, fontWeight:500, borderRadius:10, cursor:disabled?"not-allowed":"pointer", opacity:disabled?0.45:1, transition:"background .14s, color .14s, opacity .14s", width:full?"100%":undefined, border:"1.5px solid transparent", letterSpacing:"0.01em", whiteSpace:"nowrap" };
  const styles = { solid:{background:"var(--blue)",color:"#fff",borderColor:"var(--blue)"}, outline:{background:"transparent",color:"var(--ink)",borderColor:"var(--line-soft)"}, ghost:{background:"transparent",color:"var(--mute)",borderColor:"transparent"} };
  return <button onClick={disabled?undefined:onClick} style={{...base,...(styles[variant]||styles.solid)}}>{icon&&<span style={{display:"flex",alignItems:"center"}}>{icon}</span>}{children}</button>;
}

function Badge({ children, tone = "mute" }) {
  const t = { blue:{bg:"var(--blue-soft)",color:"var(--blue-ink)"}, ok:{bg:"#e6f5ee",color:"var(--ok)"}, mute:{bg:"var(--bg-3)",color:"var(--mute)"} };
  const s = t[tone]||t.mute;
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:6,fontSize:11,fontWeight:500,letterSpacing:"0.04em",background:s.bg,color:s.color,fontFamily:"'DM Mono',monospace"}}>{children}</span>;
}

function QtyStepper({ value = 0, onChange, min = 0, max = 99 }) {
  const btn = (on) => ({ width:30,height:30,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:400,lineHeight:1,cursor:on?"pointer":"not-allowed",background:on?"var(--bg-3)":"var(--bg-2)",color:on?"var(--ink)":"var(--mute-2)",border:"1px solid var(--line)",transition:"background .12s",userSelect:"none" });
  return <div style={{display:"inline-flex",alignItems:"center",gap:8}}><button onClick={()=>value>min&&onChange(value-1)} style={btn(value>min)}>−</button><span className="mono num" style={{minWidth:24,textAlign:"center",fontSize:15,fontWeight:600}}>{value}</span><button onClick={()=>value<max&&onChange(value+1)} style={btn(value<max)}>+</button></div>;
}

  <!-- screens -->
  <script type="text/babel">
const { useEffect: useEffect2, useState: useState2, useRef: useRef2 } = React;

function HomeScreen({ t, transcript, isListening }) {
  const heroRef = useRef2(null);
  const headRef = useRef2(null);
  const subRef = useRef2(null);
  const transcriptRef = useRef2(null);
  const [dim, setDim] = useState2({ w: 1280, h: 760 });
  const [obstacles, setObstacles] = useState2([]);
  const [floats, setFloats] = useState2([]); // {id, emoji, x, y, vx, vy, rot, vrot, life}
  const [particles, setParticles] = useState2([]);
  const [hitFlash, setHitFlash] = useState2(0); // 文字ジグル発火キー
  const floatIdRef = useRef2(0);
  const particleIdRef = useRef2(0);

  // 障害物の位置を更新
  useEffect2(() => {
    const el = heroRef.current;
    if (!el) return;
    const update = () => {
      const r = el.getBoundingClientRect();
      setDim({ w: Math.max(600, Math.floor(r.width)), h: Math.max(400, Math.floor(r.height)) });
      const obs = [];
      const collect = (ref, pad = 4, id) => {
        if (!ref?.current) return;
        const rr = ref.current.getBoundingClientRect();
        obs.push({ id, x: rr.left - r.left - pad, y: rr.top - r.top - pad, w: rr.width + pad*2, h: rr.height + pad*2 });
      };
      collect(headRef, 6, "head");
      collect(subRef, 4, "sub");
      if (transcriptRef.current) collect(transcriptRef, 8, "transcript");
      setObstacles(obs);
    };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    window.addEventListener("resize", update);
    return () => { ro.disconnect(); window.removeEventListener("resize", update); };
  }, [transcript]);

  // アニメーションループ（必要時のみRAF）
  const hasAnim = floats.length > 0 || particles.length > 0;
  useEffect2(() => {
    if (!hasAnim) return;
    let raf, last;
    const step = (t) => {
      if (!last) last = t;
      const dt = Math.min((t - last) / 1000, 0.05);
      last = t;
      setFloats(prev => prev.length === 0 ? prev : prev
        .map(f => ({ ...f, x: f.x + f.vx * dt, y: f.y + f.vy * dt, vx: f.vx * 0.99, vy: f.vy - 80 * dt, rot: f.rot + f.vrot * dt, life: f.life - dt }))
        .filter(f => f.life > 0 && f.y > -120));
      setParticles(prev => prev.length === 0 ? prev : prev
        .map(p => ({ ...p, x: p.x + p.vx * dt, y: p.y + p.vy * dt, vy: p.vy + 900 * dt, life: p.life - dt }))
        .filter(p => p.life > 0));
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [hasAnim]);

  const PARTICLE_COLORS = ["#ff5b6e","#ffb800","#0047ff","#1f8a5b","#a855f7","#fb923c"];
  const TAP_EMOJIS = ["✨","⭐","💫","🎉","🌟","💖","🎈","🌈"];

  function spawnTapBurst(x, y) {
    // パーティクル
    const partOnes = Array.from({length: 10}, () => ({
      id: particleIdRef.current++,
      x, y,
      vx: (Math.random()-0.5) * 500,
      vy: -120 - Math.random()*180,
      life: 0.6 + Math.random()*0.4,
      color: PARTICLE_COLORS[Math.floor(Math.random()*PARTICLE_COLORS.length)],
      size: 6 + Math.random()*6,
    }));
    setParticles(prev => prev.length >= 80 ? [...prev.slice(prev.length-80+partOnes.length), ...partOnes] : [...prev, ...partOnes]);
    // 舞い上がる絵文字
    const floatOnes = Array.from({length: 4}, () => ({
      id: floatIdRef.current++,
      emoji: TAP_EMOJIS[Math.floor(Math.random()*TAP_EMOJIS.length)],
      x: x + (Math.random()-0.5)*40,
      y: y + (Math.random()-0.5)*20,
      vx: (Math.random()-0.5) * 120,
      vy: -120 - Math.random()*80,
      rot: (Math.random()-0.5)*40,
      vrot: (Math.random()-0.5)*180,
      life: 1.6 + Math.random()*0.6,
    }));
    setFloats(prev => prev.length >= 40 ? [...prev.slice(prev.length-40+floatOnes.length), ...floatOnes] : [...prev, ...floatOnes]);
  }

  function handleHit(id) {
    // ボールが文字に当たったらジグル
    if (id === "head") {
      setHitFlash(Date.now());
    }
  }

  function handleSectionTap(e) {
    const el = heroRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    spawnTapBurst(e.clientX - r.left, e.clientY - r.top);
  }

  return (
    <section
      data-screen-label="01 ホーム"
      ref={heroRef}
      onPointerDown={handleSectionTap}
      style={{ position:"relative", minHeight:"calc(100vh - 72px - 88px)", overflow:"hidden", padding:"0 80px", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", touchAction:"none" }}
    >
      <div style={{ position:"absolute", inset:0, zIndex:1 }}>
        <window.BouncingBall width={dim.w} height={dim.h} size={72} gravity={2400} restitution={0.92} bounces={6} startFrom="top-right" obstacles={obstacles} onObstacleHit={handleHit} />
      </div>

      {/* 舞い上がる絵文字 */}
      <div style={{ position:"absolute", inset:0, zIndex:3, pointerEvents:"none", overflow:"hidden" }}>
        {floats.map(f => (
          <div key={f.id} style={{
            position:"absolute",
            left: f.x - 24, top: f.y - 24,
            width:48, height:48,
            display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:36,
            transform:`rotate(${f.rot}deg)`,
            opacity: Math.min(1, f.life * 1.2),
            filter:"drop-shadow(0 4px 8px rgba(0,0,0,0.12))",
            willChange:"transform, opacity",
          }}>
            {f.emoji}
          </div>
        ))}
      </div>

      {/* パーティクル */}
      <div style={{ position:"absolute", inset:0, zIndex:4, pointerEvents:"none", overflow:"hidden" }}>
        {particles.map(p => (
          <div key={p.id} style={{
            position:"absolute",
            left: p.x - p.size/2, top: p.y - p.size/2,
            width: p.size, height: p.size,
            background: p.color,
            borderRadius:"50%",
            opacity: Math.min(1, p.life * 1.5),
            willChange:"transform, opacity",
          }}/>
        ))}
      </div>

      <div style={{ position:"relative", zIndex:2, textAlign:"center", maxWidth:1200, pointerEvents:"none" }}>
        <div className="mono" style={{ fontSize:18, color:"var(--mute)", letterSpacing:"0.32em" }}>WELCOME · {new Date().toLocaleDateString("ja-JP")}</div>
        <h1
          ref={headRef}
          key={hitFlash}
          style={{
            marginTop:36, fontSize:"clamp(88px, 9.5vw, 144px)", lineHeight:1.0, letterSpacing:"0.01em",
            fontWeight:500, whiteSpace:"nowrap", display:"inline-block",
            animation: hitFlash ? "jiggle .45s cubic-bezier(.36,.07,.19,.97)" : "none",
          }}
        >
          {t.welcome}
        </h1>
        <style>{`@keyframes jiggle { 0%{transform:translate(0,0) rotate(0);} 15%{transform:translate(-4px,2px) rotate(-2deg) scale(1.04);} 30%{transform:translate(5px,-3px) rotate(2deg) scale(0.98);} 50%{transform:translate(-3px,1px) rotate(-1deg) scale(1.02);} 70%{transform:translate(2px,-1px) rotate(1deg);} 100%{transform:translate(0,0) rotate(0);} }`}</style>
        <p ref={subRef} style={{ marginTop:32, fontSize:28, color:"var(--mute)", lineHeight:1.6, display:"inline-block" }}>{t.welcomeSub}</p>
        {/* 音声波形アニメ */}
        <div style={{ marginTop:56, display:"flex", flexDirection:"column", alignItems:"center", gap:14 }}>
          <div style={{ display:"flex", gap:6, alignItems:"center", height:56 }}>
            {[0.35,0.6,0.85,1.0,0.75,0.9,0.5,0.7,0.4].map((h,i) => (
              <div key={i} style={{
                width:5, borderRadius:3,
                height: `${h*56}px`,
                background: isListening ? "var(--blue)" : "var(--mute-2)",
                animation: isListening ? `wave-bar ${0.5+i*0.07}s ease-in-out infinite alternate` : "none",
                animationDelay: `${i*0.06}s`,
                transition: "background .3s",
              }}/>
            ))}
          </div>
          <div className="mono" style={{ fontSize:16, letterSpacing:"0.28em", color: isListening ? "var(--blue)" : "var(--mute)" }}>
            {isListening ? "● LISTENING" : "● STANDBY"}
          </div>
        </div>
        <style>{`@keyframes wave-bar { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }`}</style>

        {transcript ? (
          <div ref={transcriptRef} style={{ marginTop:36, padding:"28px 48px", background:"rgba(255,255,255,0.8)", backdropFilter:"blur(8px)", border:"1px solid var(--line)", borderRadius:20, maxWidth:900, width:"100%", display:"inline-block" }}>
            <div style={{ fontSize:36, fontWeight:500, lineHeight:1.55, color:"var(--ink)" }}>
              「{transcript}<span style={{ display:"inline-block", width:3, height:32, background:"var(--blue)", verticalAlign:"middle", marginLeft:6 }}/>」
            </div>
          </div>
        ) : (
          <div className="mono" style={{ marginTop:36, fontSize:18, color:"var(--mute-2)", letterSpacing:"0.18em" }}>{t.examplePrompt}</div>
        )}
      </div>
    </section>
  );
}

function ListeningScreen({ t, lang, transcript, parseProgress, isListening, onRetry, onCancel, onDone }) {
  const targetLen = 24;
  const progress = Math.min(1, (transcript || "").length / targetLen);
  const state = parseProgress ? "parsing" : "listening";
  return (
    <section data-screen-label="02 音声入力" style={{ padding:"56px 80px 40px", minHeight:"calc(100vh - 72px - 88px)" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
        <div>
          <div className="mono" style={{ fontSize:11, color:state==="listening"?"var(--blue)":"var(--ink)", letterSpacing:"0.28em" }}>● {state==="listening"?"LISTENING":"PARSING"}</div>
          <h1 style={{ marginTop:14, fontSize:56, fontWeight:500, letterSpacing:"0.01em" }}>{state==="listening"?t.listening:t.parsing}</h1>
          <p style={{ marginTop:10, color:"var(--mute)", fontSize:16 }}>{t.listeningSub}</p>
        </div>
        <window.Button variant="ghost" onClick={onCancel} icon={window.Icon.close(14)}>{t.cancel}</window.Button>
      </div>
      <div style={{ marginTop:60, marginBottom:40 }}>
        <window.BouncingBall width={1080} height={220} size={42} gravity={2400} restitution={0.92} progress={progress} showTrail={false} />
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", maxWidth:1080, margin:"0 auto" }}>
        <span className="mono" style={{ fontSize:10, color:"var(--mute)", letterSpacing:"0.2em" }}>START</span>
        <span className="mono" style={{ fontSize:10, color:progress>0.8?"var(--blue)":"var(--mute)", letterSpacing:"0.2em" }}>{Math.round(progress*100)}%</span>
        <span className="mono" style={{ fontSize:10, color:"var(--mute)", letterSpacing:"0.2em" }}>ORDER</span>
      </div>
      <div style={{ marginTop:56, padding:"32px 40px", background:"var(--bg-2)", border:"1px solid var(--line)", borderRadius:12, minHeight:120, display:"flex", flexDirection:"column", justifyContent:"center" }}>
        <div className="mono" style={{ fontSize:10, color:"var(--mute)", letterSpacing:"0.26em", marginBottom:12 }}>TRANSCRIPT</div>
        <div style={{ fontSize:28, fontWeight:500, lineHeight:1.5, minHeight:42 }}>
          {transcript ? <span>「{transcript}<span style={{ display:"inline-block", width:2, height:24, background:"var(--blue)", verticalAlign:"middle", marginLeft:4 }}/>」</span> : <span style={{ color:"var(--mute-2)" }}>{t.examplePrompt}</span>}
        </div>
      </div>
      <div style={{ marginTop:32, display:"flex", justifyContent:"flex-end", gap:12, alignItems:"center" }}>
        {isListening
          ? <span className="mono" style={{ fontSize:11, color:"var(--blue)", letterSpacing:"0.2em" }}>● LISTENING</span>
          : <span className="mono" style={{ fontSize:11, color:"var(--mute)", letterSpacing:"0.2em" }}>● STOPPED</span>}
      </div>
    </section>
  );
}

function ConfirmScreen({ t, lang, items, transcript, isListening, orderQueue, onEdit, onComplete }) {
  const total = items.reduce((s, it) => s + window.MENU_MAP[it.id].tickets * it.qty, 0);
  return (
    <section data-screen-label="03 ご注文確認" style={{ padding:"48px 80px 40px" }}>
      {/* ヘッダー */}
      <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", marginBottom:32 }}>
        <div>
          <h1 style={{ fontSize:48, fontWeight:500 }}>{t.confirm}</h1>
          <p style={{ marginTop:8, color:"var(--mute)" }}>声で変更・追加・キャンセルできます</p>
        </div>
        {/* リスニングインジケーター */}
        <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:10 }}>

      });
      const data = await res.json();
      const raw = data.content?.[0]?.text || "";
      const match = raw.match(/\{[\s\S]*\}/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        if (parsed.type === "chat" && parsed.reply) {
          return { type:"chat", reply: parsed.reply };
        }
        const items = (parsed.items||[]).filter(it=>window.MENU_MAP[it.id]&&it.qty>0);
        return { type: parsed.type === "modify" ? "modify" : "new", items };
      }
    } catch(e) { console.warn("Haiku classify error", e); }
    return { type:"chat", reply:"あれ、ちょっと聞こえなくて…もう一度どうぞ〜" };
  }

  const t = window.STRINGS[lang];
  const cartItems = Object.entries(cart).filter(([,qty])=>qty>0).map(([id,qty])=>({id,qty}));
  const cartCount = cartItems.reduce((s,it)=>s+it.qty,0);

  function stopVoice() {
    clearTimeout(silenceRef.current);
    if (recRef.current) {
      recRef.current._stopped = true;
      try { recRef.current.stop(); } catch(e) {}
      recRef.current = null;
    }
    setIsListening(false);
  }

  const startVoice = useCallback3(() => {
    // 既存のrecが動いていたら先に止める（二重起動防止）
    if (recRef.current) {
      recRef.current._stopped = true;
      try { recRef.current.stop(); } catch(e) {}
      recRef.current = null;
    }
    clearTimeout(silenceRef.current);
    setTranscript(""); setParseProgress(false);

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      // フォールバック：シミュレーション
      const phrases = ["牛乳を2本と、プリンをひとつ","パンケーキひとつください","ジェラートを2つとラスクをひとつ"];
      const phrase = phrases[Math.floor(Math.random()*phrases.length)];
      let i = 0;
      const timer = setInterval(() => {
        i++; setTranscript(phrase.slice(0,i));
        if (i >= phrase.length) {
          clearInterval(timer);
          setTimeout(()=>{ setParseProgress(true); setTimeout(()=>{ setOrderItems(parseTranscript(phrase)); setParseProgress(false); setScreen("confirm"); },800); },500);
        }
      },60);
      return;
    }

    const rec = new SR();
    rec.lang = lang === "en" ? "en-US" : "ja-JP";
    rec.continuous = true;
    rec.interimResults = true;
    rec._stopped = false;
    recRef.current = rec;

    rec.onresult = (e) => {
      let text = "";
      for (let i = 0; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
      }
      setTranscript(text);
      // 1.5秒の無音で自動確定（音声は止めずバックグラウンドで解析）
      clearTimeout(silenceRef.current);
      if (text.trim()) {
        silenceRef.current = setTimeout(async () => {
          // 音声は停止せずそのまま継続。トランスクリプトだけクリア
          setTranscript("");
          if (screenRef.current === "confirm") {
            const result = await classifyAndActWithHaiku(text, orderItemsRef.current);
            if (result.type === "chat") {
              showClerk(result.reply);
            } else if (result.type === "modify") {
              if (result.items.length === 0) {
                setOrderItems([]);
                setScreen("home");
                showClerk("注文を全部キャンセルしますね〜！");
                return;
              }
              setOrderItems(result.items);
            } else {
              if (result.items.length > 0) {
                setOrderQueue(q => [...q, result.items]);
                showClerk("次のお客さんですね、順番に作りますね〜！");
              }
            }
          } else {
            const result = await parseWithHaiku(text);
            if (result.type === "chat") {
              showClerk(result.reply);
            } else {
              setOrderItems(result.items);
              setScreen("confirm");
            }
          }
        }, 1500);
      }
    };

    rec.onerror = (e) => {
      if (e.error === "not-allowed") {
        alert("マイクの使用が許可されていません。ブラウザの設定を確認してください。");
        stopVoice(); setScreen("home");
      }
    };

    rec.onend = () => {
      recRef.current = null;
      setIsListening(false);
      // _stopped=true は stopVoice() による意図的停止 → 再起動しない
      // _stopped=false は自然終了 → ホーム・確認画面なら再起動
      if (!rec._stopped && (screenRef.current === "home" || screenRef.current === "confirm")) {
        setTimeout(() => startVoice(), 1200);
      }
    };

    rec.start();
    setIsListening(true);
  }, [lang]);

  function parseTranscript(text) {
    const items = [];
    window.MENU.forEach((m)=>{ const keys=[m.nameJa,m.nameEn.toLowerCase(),m.id]; if(keys.some((k)=>text.toLowerCase().includes(k.toLowerCase()))){ const m2=text.match(/(\d+)/); items.push({id:m.id,qty:m2?Math.min(9,parseInt(m2[1])):1}); }});
    return items; // マッチなしなら空配列を返す（デフォルト牛乳は廃止）
  }

  function editConfirmItem(id,qty){ setOrderItems((p)=>qty===0?p.filter((it)=>it.id!==id):p.map((it)=>it.id===id?{...it,qty}:it)); }
  function handleCartChange(id,qty){ setCart((p)=>({...p,[id]:qty})); }
  function checkoutFromProducts(){ setOrderItems(cartItems); setScreen("cart"); }

  function handleComplete() {
    const paying = orderItems;
    const nextId = String(parseInt(history[0]?.id||"0000")+1).padStart(4,"0");
    setHistory((p)=>[{id:nextId,minAgo:0,items:paying,status:"done"},...p]);
    setLastOrderId(nextId);
    // 残りキューを保存してから画面をリセット → ThankYou後に昇格
    afterThankYouRef.current = orderQueueRef.current;
    setOrderItems([]);
    setOrderQueue([]);
    setShowThankYou(true);
  }

  // orderItemsRef / orderQueueRef を常に最新に同期（closure問題回避）
  useEffect3(() => { orderItemsRef.current = orderItems; }, [orderItems]);
  useEffect3(() => { orderQueueRef.current = orderQueue; }, [orderQueue]);

  // screenRef を常に最新の screen に同期
  useEffect3(() => { screenRef.current = screen; }, [screen]);

  // ホーム・確認画面に入ったら自動で聴き始める
  useEffect3(() => {
    if (screen === "home" || screen === "confirm") {
      const t = setTimeout(() => startVoice(), 1500);
      return () => clearTimeout(t);
    }
  }, [screen]);

  const NAV = [{key:"home",label:t.nav.home},{key:"products",label:t.nav.products},{key:"history",label:t.nav.history}];

  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
      <header style={{ position:"sticky", top:0, zIndex:50, height:64, background:"rgba(255,255,255,0.96)", backdropFilter:"blur(8px)", borderBottom:"1px solid var(--line)", display:"flex", alignItems:"center", padding:"0 32px", gap:24 }}>
        <button onClick={()=>setScreen("home")} style={{ display:"flex", alignItems:"baseline", gap:8 }}>
          <span style={{ fontSize:16, fontWeight:700, letterSpacing:"0.08em" }}>MILK STAND</span>
        </button>
        <nav style={{ flex:1, display:"flex", justifyContent:"center", gap:2 }}>
          {NAV.map((tab)=>{
            const active=screen===tab.key;
            return <button key={tab.key} onClick={()=>setScreen(tab.key)} style={{ padding:"6px 20px", borderRadius:8, fontSize:14, fontWeight:active?600:400, color:active?"var(--ink)":"var(--mute)", background:active?"var(--bg-3)":"transparent", transition:"all .15s", border:"none", cursor:"pointer" }}>{tab.label}</button>;
          })}
        </nav>
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          {cartCount>0 && <button onClick={()=>setScreen("cart")} style={{ display:"flex", alignItems:"center", gap:7, padding:"6px 14px", background:"var(--bg-3)", borderRadius:8, border:"none", cursor:"pointer", fontSize:13 }}>{window.Icon.cart(14)}<span className="mono num" style={{ fontWeight:600 }}>{cartCount}</span></button>}

          {/* APIキー設定 */}
          <div style={{ position:"relative" }}>
            <button
              onClick={()=>setShowKeyInput(v=>!v)}
              title="Claude API Key"
              style={{ padding:"5px 11px", fontSize:12, borderRadius:8, border:"1px solid var(--line)", background: apiKey ? "var(--ok)" : "var(--bg-3)", color: apiKey ? "#fff" : "var(--mute)", cursor:"pointer" }}
            >
              {apiKey ? "🔑 AI解析ON" : "🔑 APIキー"}
            </button>
            {showKeyInput && (
              <div style={{ position:"absolute", right:0, top:"calc(100% + 8px)", zIndex:100, background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:14, boxShadow:"0 8px 24px rgba(0,0,0,.1)", width:320 }}>
                <div style={{ fontSize:12, fontWeight:600, marginBottom:8 }}>Anthropic APIキー</div>
                <input
                  type="password"
                  placeholder="sk-ant-..."
                  defaultValue={apiKey}
                  onChange={e=>{ const v=e.target.value; setApiKey(v); localStorage.setItem("ms_api_key",v); }}
                  style={{ width:"100%", padding:"7px 10px", borderRadius:7, border:"1px solid var(--line)", fontSize:13, outline:"none" }}
                />
                <div style={{ fontSize:11, color:"var(--mute)", marginTop:6 }}>キーはlocalStorageに保存されます。</div>
                {/* 接続テストボタン */}
                <ApiTestButton />
                <button onClick={()=>setShowKeyInput(false)} style={{ marginTop:8, width:"100%", padding:"6px", borderRadius:7, background:"var(--ink)", color:"#fff", fontSize:13, cursor:"pointer" }}>閉じる</button>
              </div>
            )}
          </div>

          <div style={{ display:"flex", border:"1px solid var(--line)", borderRadius:8, overflow:"hidden" }}>
            {["ja","en"].map((l)=><button key={l} onClick={()=>setLang(l)} style={{ padding:"5px 13px", fontSize:12, fontWeight:lang===l?600:400, background:lang===l?"var(--ink)":"transparent", color:lang===l?"#fff":"var(--mute)", border:"none", cursor:"pointer", transition:"all .15s" }}>{l==="ja"?"日本":"EN"}</button>)}
          </div>
        </div>
      </header>

      <main style={{ flex:1 }}>
        {screen==="home"      && <window.HomeScreen t={t} transcript={transcript} isListening={isListening} />}
        {screen==="products"  && <window.ProductsScreen t={t} lang={lang} cart={cart} onChange={handleCartChange} onCheckout={checkoutFromProducts} onAddItem={addCustomItem} onRemoveItem={removeCustomItem}/>}
        {screen==="confirm"   && <window.ConfirmScreen t={t} lang={lang} items={orderItems} transcript={transcript} isListening={isListening} orderQueue={orderQueue} onEdit={editConfirmItem} onComplete={handleComplete}/>}
        {screen==="cart"      && <window.CartScreen t={t} lang={lang} items={cartItems} onBack={()=>setScreen("products")} onPay={()=>{ setOrderItems(cartItems); handleComplete(); }}/>}
        {screen==="history"   && <window.HistoryScreen t={t} lang={lang} history={history} onClear={()=>setHistory([])}/>}
      </main>

      {showThankYou && <window.ThankYouOverlay t={t} orderId={lastOrderId} onClose={()=>{
        setShowThankYou(false);
        const next = afterThankYouRef.current;
        if (next.length > 0) {
          setOrderItems(next[0]);
          setOrderQueue(next.slice(1));
          afterThankYouRef.current = [];
          setScreen("confirm");
        } else {
          setScreen("home");
        }
      }}/>}

      {/* 店員吹き出し */}
      {clerkReply && (
        <div style={{ position:"fixed", bottom:40, left:"50%", transform:"translateX(-50%)", zIndex:150, maxWidth:900, width:"calc(100% - 80px)", padding:"32px 40px", background:"#fff", border:"1px solid var(--line)", borderRadius:28, boxShadow:"0 20px 60px rgba(0,0,0,.15)", animation:"clerk-pop .3s ease" }}>
          <div style={{ display:"flex", alignItems:"center", gap:24 }}>
            <img src="deli_hibi.png" alt="店員" style={{ width:96, height:96, borderRadius:20, flexShrink:0, objectFit:"cover", background:"#ff7a1a" }} onError={(e)=>{ e.target.style.display="none"; }} />
            <div style={{ flex:1, minWidth:0 }}>
              <div className="mono" style={{ fontSize:11, color:"var(--mute)", letterSpacing:"0.28em", marginBottom:8 }}>STAFF · DELI HIBI</div>
              <div style={{ fontSize:32, fontWeight:500, lineHeight:1.5, color:"var(--ink)" }}>{clerkReply}</div>
            </div>
          </div>
          <style>{`@keyframes clerk-pop { from { transform: translateX(-50%) translateY(20px); opacity:0; } to { transform: translateX(-50%) translateY(0); opacity:1; } }`}</style>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
